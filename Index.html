<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mohamed Abdulkader — SIG Combibloc</title>
  <style>
    :root{
      --sig-blue:#005EB8;
      --sig-dark:#073b63;
      --card-width:420px;
      --radius:14px;
      --glass: rgba(255,255,255,0.95);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#f3f7fb,#ffffff);display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{
      width:100%;
      max-width:var(--card-width);
      background:var(--glass);
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(3,17,40,0.12);
      padding:26px;
      text-align:center;
      border:1px solid rgba(0,0,0,0.04);
    }
    .logo{
      width:84px;height:84px;margin:0 auto 14px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--sig-blue),#2a8ae6);
      color:white;font-weight:700;font-size:26px;letter-spacing:0.6px;
      box-shadow:0 6px 18px rgba(0,94,184,0.15);
    }
    h1{font-size:20px;margin:6px 0 2px;color:var(--sig-dark);}
    .title{font-size:13px;color:#5b6b7b;margin-bottom:16px;font-weight:600;}
    .company{font-size:13px;color:#5b6b7b;margin-bottom:18px;}
    .buttons{display:flex;flex-direction:column;gap:10px;padding:0 18px 8px;}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      gap:10px;padding:12px 14px;border-radius:10px;text-decoration:none;font-weight:600;
      border:1px solid rgba(3,17,40,0.06);
      background:white;color:var(--sig-dark);
      box-shadow:0 4px 10px rgba(12,32,80,0.04);
    }
    .btn.call{border-left:4px solid #34a853;}
    .btn.wa{border-left:4px solid #25D366;}
    .btn.email{border-left:4px solid #0072c6;}
    .btn.linkedin{border-left:4px solid #0A66C2;}
    .btn svg{width:18px;height:18px;opacity:0.95}
    .small{font-size:12px;color:#8795a6;margin-top:14px;}
    @media(max-width:420px){
      .card{padding:18px;border-radius:12px}
      .logo{width:72px;height:72px;font-size:22px}
    }
  </style>
</head>
