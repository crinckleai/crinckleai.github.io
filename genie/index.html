<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rub the brass lamp, make three wishes, and get a djinn's verdict with delivery dates and odds.">
<meta property="og:title" content="The Brass Lamp">
<meta property="og:description" content="Three wishes. One very honest djinn.">
<title>The Brass Lamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&family=Courier+Prime&display=swap">
<style>
/* Layout: one centered scroll of parchment-on-night, the lamp as the single hero moment, wishes as sealed scrolls. Single dark theme by choice. */
:root{
  color-scheme: dark;
  --night:#120d22;
  --night-2:#1d1535;
  --brass:#d9a441;
  --brass-dim:#8a6a2c;
  --smoke:#b9a7e6;
  --parch:#efe2c4;
  --ink:#2a1d10;
  --fg:#efe6d6;
  --muted:#a99cc4;
  --danger:#e07a6a;
  --display:"Cinzel Decorative", "Trajan Pro", Georgia, serif;
  --body:"Lora", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", monospace;
}
html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{
  background: radial-gradient(1200px 600px at 50% -10%, #2b1f52 0%, var(--night) 60%) fixed, var(--night);
  color:var(--fg); font-family:var(--body); font-size:17px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:680px; margin:0 auto; padding-block:64px 64px; display:flex; flex-direction:column; gap:28px}
h1{font-family:var(--display); color:var(--brass); font-size:clamp(28px,7vw,44px); line-height:1.1; margin:0; text-align:center; text-wrap:balance; letter-spacing:.02em}
.sub{color:var(--muted); text-align:center; margin:6px 0 0; font-style:italic}
#stars{position:fixed; inset:0; z-index:-1; pointer-events:none}

/* Lamp stage */
.stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.lamp-btn{background:none; border:0; padding:0; cursor:pointer; position:relative; width:min(300px,80vw)}
.lamp-btn:focus-visible{outline:2px dashed var(--brass); outline-offset:8px; border-radius:12px}
.lamp-btn svg{width:100%; height:auto; display:block; filter:drop-shadow(0 10px 30px rgba(217,164,65,.25))}
.lamp-btn.rubbing svg{animation:rub .18s ease-in-out 6}
@keyframes rub{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
.hint{font-family:var(--mono); font-size:13px; color:var(--brass); letter-spacing:.12em; text-transform:uppercase}
.puff{position:absolute; left:78%; top:8%; width:40px; height:40px; border-radius:50%; background:radial-gradient(circle,var(--smoke),transparent 70%); opacity:0; pointer-events:none}
.lamp-btn.rubbing .puff{animation:puff 1.4s ease-out forwards}
.lamp-btn.rubbing .puff:nth-child(2){animation-delay:.25s}
.lamp-btn.rubbing .puff:nth-child(3){animation-delay:.5s}
@keyframes puff{0%{opacity:.9; transform:translate(0,0) scale(.4)}100%{opacity:0; transform:translate(-40px,-140px) scale(3)}}

/* Genie speech */
.genie{display:flex; gap:14px; align-items:flex-start}
.genie .face{flex:0 0 52px; height:52px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #c9b8f5, #6b55b5 70%); box-shadow:0 0 24px rgba(185,167,230,.45); display:grid; place-items:center; font-family:var(--display); color:var(--night); font-size:20px}
.bubble{min-width:0; background:var(--night-2); border:1px solid rgba(185,167,230,.25); border-radius:4px 18px 18px 18px; padding:14px 18px; color:var(--fg)}
.bubble p{margin:0}
.bubble p + p{margin-top:8px}

/* Forms */
.card{background:var(--parch); color:var(--ink); border-radius:6px; padding:22px; box-shadow:0 14px 40px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:14px; position:relative}
.card::before{content:""; position:absolute; inset:6px; border:1px solid rgba(42,29,16,.25); border-radius:3px; pointer-events:none}
label{font-family:var(--mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#6b4e1f}
input[type=text], textarea{width:100%; box-sizing:border-box; font:inherit; color:var(--ink); background:#fbf4e2; border:1px solid #c7ad7a; border-radius:4px; padding:12px 14px}
textarea{min-height:90px; resize:vertical}
input:focus-visible, textarea:focus-visible{outline:2px solid var(--brass-dim); outline-offset:1px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{font-family:var(--display); font-size:15px; letter-spacing:.04em; border:0; border-radius:999px; padding:12px 22px; cursor:pointer; background:linear-gradient(180deg,#f0c463,var(--brass)); color:var(--ink); box-shadow:0 4px 0 var(--brass-dim)}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--brass-dim)}
.btn:focus-visible{outline:2px dashed var(--fg); outline-offset:3px}
.btn[disabled]{opacity:.5; cursor:wait}
.btn.ghost{background:transparent; color:var(--brass); box-shadow:inset 0 0 0 1px var(--brass)}
.pips{display:flex; gap:8px; justify-content:center}
.pip{width:14px; height:14px; border-radius:50%; border:2px solid var(--brass-dim)}
.pip.on{background:var(--brass); border-color:var(--brass)}
.err{color:#9b2d1f; font-size:14px; margin:0}

/* Verdicts */
.verdicts{display:flex; flex-direction:column; gap:18px}
.scroll{background:var(--parch); color:var(--ink); border-radius:6px; padding:20px 22px; display:grid; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); animation:unroll .6s ease-out both}
.scroll:nth-child(2){animation-delay:.25s}
.scroll:nth-child(3){animation-delay:.5s}
@keyframes unroll{from{opacity:.2; transform:scaleY(.85)}to{opacity:1; transform:none}}
.scroll .num{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#8a6a2c}
.scroll .wish{font-family:var(--display); font-size:19px; line-height:1.3; margin:0; overflow-wrap:anywhere}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{background:#f8eed6; border:1px solid #d9c49a; border-radius:4px; padding:10px 12px; min-width:0}
.stat .k{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8a6a2c}
.stat .v{font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.meter{height:8px; border-radius:4px; background:#e5d4ad; overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; background:linear-gradient(90deg,#b5452f,#d9a441,#4f8a3c)}
.roast{margin:0; font-style:italic}
.fine{margin:0; font-family:var(--mono); font-size:12px; color:#6b5a40}
.disclaimer{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; margin:0}

/* Ledger (owner only) */
.ledger{border-top:1px solid rgba(217,164,65,.3); padding-top:22px; display:flex; flex-direction:column; gap:14px}
.ledger h2{font-family:var(--display); color:var(--brass); font-size:22px; margin:0}
.ledger .entry{background:var(--night-2); border:1px solid rgba(185,167,230,.2); border-radius:6px; padding:14px 16px; min-width:0}
.ledger .who{font-weight:600; color:var(--brass)}
.ledger .when{font-family:var(--mono); font-size:12px; color:var(--muted)}
.ledger ol{margin:8px 0 0; padding-left:20px}
.ledger li{overflow-wrap:anywhere}
.ledger li small{color:var(--muted)}
.empty{color:var(--muted); font-style:italic; margin:0}

.sound{position:fixed; z-index:20; top:calc(12px + env(safe-area-inset-top, 0px)); right:calc(12px + env(safe-area-inset-right, 0px)); font-family:var(--mono); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--brass); background:rgba(18,13,34,.8); border:1px solid var(--brass-dim); border-radius:999px; padding:8px 14px; cursor:pointer; display:flex; gap:8px; align-items:center}
.sound:focus-visible{outline:2px dashed var(--brass); outline-offset:3px}
.sound .bars{display:inline-flex; gap:2px; align-items:flex-end; height:12px}
.sound .bars i{width:3px; background:var(--brass); height:4px}
.sound.playing .bars i{animation:eq .7s ease-in-out infinite alternate}
.sound.playing .bars i:nth-child(2){animation-delay:.2s}
.sound.playing .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:12px}}
/* Loading: swirling smoke orb + rotating status lines */
.conjure{display:flex; flex-direction:column; align-items:center; gap:18px; padding-block:28px 8px; text-align:center}
.orb{position:relative; width:120px; height:120px}
.orb i{position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:var(--brass); border-left-color:rgba(217,164,65,.35); animation:spin 1.6s linear infinite}
.orb i:nth-child(2){inset:14px; border-top-color:var(--smoke); border-left-color:rgba(185,167,230,.3); animation-duration:2.3s; animation-direction:reverse}
.orb i:nth-child(3){inset:30px; border-top-color:#f0c463; animation-duration:1.1s}
.orb b{position:absolute; inset:44px; border-radius:50%; background:radial-gradient(circle, #f6d27a 0%, rgba(217,164,65,.4) 55%, transparent 75%); animation:pulse 1.4s ease-in-out infinite}
.orb s{position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--smoke); opacity:0; animation:spark 2.4s ease-out infinite}
.orb s:nth-of-type(2){animation-delay:.8s; background:var(--brass)}
.orb s:nth-of-type(3){animation-delay:1.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.8); opacity:.7}50%{transform:scale(1.15); opacity:1}}
@keyframes spark{0%{opacity:1; transform:rotate(var(--a,0deg)) translateY(0)}100%{opacity:0; transform:rotate(var(--a,0deg)) translateY(-70px)}}
.conjure .status{font-family:var(--display); color:var(--brass); font-size:18px; min-height:2.6em; max-width:30ch; text-wrap:balance; transition:opacity .35s}
.conjure .status.fade{opacity:0}
.conjure .elapsed{font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.dots::after{content:''; animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (max-width:420px){ .stats{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} .orb b{opacity:1} }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<button class="sound" id="soundBtn" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLbl">Sound off</span></button>
<main class="wrap">
  <header>
    <h1>The Brass Lamp</h1>
    <p class="sub">Three wishes. One very honest djinn.</p>
  </header>

  <section class="stage" id="stage">
    <button class="lamp-btn" id="lamp" aria-label="Rub the lamp">
      <span class="puff"></span><span class="puff"></span><span class="puff"></span>
      <svg viewBox="0 0 300 170" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6d27a"/><stop offset=".55" stop-color="#d9a441"/><stop offset="1" stop-color="#7a5a22"/>
          </linearGradient>
        </defs>
        <ellipse cx="140" cy="158" rx="70" ry="8" fill="#000" opacity=".35"/>
        <path d="M95 150 h90 l-12 -14 h-66 z" fill="url(#g)"/>
        <path d="M60 110 C60 70 220 70 220 110 C220 135 175 140 140 140 C105 140 60 135 60 110 Z" fill="url(#g)"/>
        <path d="M215 100 C245 95 255 70 285 52 C280 75 262 110 220 120 Z" fill="url(#g)"/>
        <path d="M65 100 C30 95 25 135 60 128" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
        <path d="M110 80 C110 60 170 60 170 80 Z" fill="url(#g)"/>
        <circle cx="140" cy="55" r="7" fill="url(#g)"/>
        <path d="M80 108 C110 118 170 118 200 108" fill="none" stroke="#fff3c8" stroke-width="2" opacity=".5"/>
      </svg>
    </button>
    <span class="hint" id="hint">Rub the lamp</span>
  </section>

  <section id="flow" aria-live="polite"></section>

  <p class="disclaimer">Odds and delivery dates are pure comedy. No actual magic is guaranteed. Your name and wishes are saved privately by the lamp's keeper, so don't type anything you wouldn't say out loud.</p>

</main>

<script>
(() => {
  // ---------- stars ----------
  const cv = document.getElementById('stars'), cx = cv.getContext('2d');
  let stars = [];
  function sizeStars(){
    cv.width = innerWidth; cv.height = innerHeight;
    stars = Array.from({length: Math.round(innerWidth*innerHeight/9000)}, () => ({x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.3+.2, p:Math.random()*6}));
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function drawStars(t){
    cx.clearRect(0,0,cv.width,cv.height);
    for(const s of stars){ cx.globalAlpha = .35 + .5*Math.abs(Math.sin(s.p + t/1400)); cx.fillStyle = '#f3e7c9'; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); }
    if(!still) requestAnimationFrame(drawStars);
  }
  sizeStars(); addEventListener('resize', sizeStars); requestAnimationFrame(drawStars);

  // ---------- state ----------
  const $ = id => document.getElementById(id);
  const flow = $('flow');
  const st = { name:'', wishes:[], step:'idle' };
  const GENIE_API = 'https://jrbueocqgurcdojknyxd.supabase.co/functions/v1/genie';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function say(lines){
    return `<div class="genie"><div class="face">D</div><div class="bubble">${lines.map(l=>`<p>${l}</p>`).join('')}</div></div>`;
  }
  function pips(n){ return `<div class="pips" aria-label="${n} of 3 wishes made">${[0,1,2].map(i=>`<span class="pip ${i<n?'on':''}"></span>`).join('')}</div>`; }

  // ---------- audio: original Hijaz tune, synthesized live ----------
  const Audio = (() => {
    let ac = null, master = null, musicBus = null, sfxBus = null, timer = null, on = false;
    let muted = false;
    try { muted = localStorage.getItem('lampMuted') === '1'; } catch(e) {}
    // D Hijaz: D Eb F# G A Bb C D
    const N = { D3:146.83, A3:220, Bb3:233.08, C4:261.63, D4:293.66, Eb4:311.13, Fs4:369.99, G4:392, A4:440, Bb4:466.16, C5:523.25, D5:587.33, Eb5:622.25, Fs5:739.99, G5:783.99, A5:880 };
    const BPM = 104, EIGHTH = 60 / BPM / 2;
    // maqsum-style 8-step pattern: D=doum, T=tek, k=soft ka
    const DRUM = ['D','T','k','T','D','k','T','k'];
    // original melody: 4 phrases x 8 eighths, null = rest, '_' = hold
    const MEL = [
      ['D4','Eb4','Fs4','_','G4','Fs4','Eb4','D4'],
      ['Fs4','G4','A4','_','Bb4','A4','G4','Fs4'],
      ['A4','Bb4','C5','D5','C5','Bb4','A4','G4'],
      ['Fs4','Eb4','Fs4','G4','Fs4','Eb4','D4',null],
      ['D5','_','C5','Bb4','A4','_','Bb4','A4'],
      ['G4','A4','Bb4','A4','G4','Fs4','G4','_'],
      ['Eb4','Fs4','G4','A4','Bb4','A4','G4','Fs4'],
      ['Eb4','_','D4','_',null,'Fs4','Eb4','D4']
    ];
    let step = 0, nextT = 0, drone = null;

    function init(){
      if (ac) return true;
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return false;
      ac = new C();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
      musicBus = ac.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
      return true;
    }
    function noiseBuf(sec){
      const b = ac.createBuffer(1, ac.sampleRate*sec, ac.sampleRate), d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      return b;
    }
    let NB = null;
    function pluck(freq, t, dur, bus, vol=0.5){
      const o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o1.type = 'sawtooth'; o2.type = 'triangle';
      o1.frequency.value = freq; o2.frequency.value = freq*2.003;
      f.type = 'lowpass'; f.Q.value = 6;
      f.frequency.setValueAtTime(freq*9, t); f.frequency.exponentialRampToValueAtTime(freq*1.5, t+dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.006); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      const g2 = ac.createGain(); g2.gain.value = 0.25;
      o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(bus);
      o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
    }
    function doum(t){
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(55, t+0.25);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.4);
    }
    function tek(t, vol){
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = NB; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 1.2;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
      s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random()*0.5); s.stop(t+0.08);
    }
    function startDrone(){
      const out = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 600; out.gain.value = 0;
      out.gain.linearRampToValueAtTime(0.12, ac.currentTime + 3);
      const oscs = [N.D3, N.A3, N.D3*1.004].map(fr => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); return o; });
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.15; lg.gain.value = 200; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      f.connect(out); out.connect(musicBus);
      drone = { out, oscs:[...oscs, lfo] };
    }
    function tick(){
      while (nextT < ac.currentTime + 0.15) {
        const s = step % 8, bar = Math.floor(step / 8) % MEL.length;
        const d = DRUM[s];
        if (d === 'D') doum(nextT); else if (d === 'T') tek(nextT, 0.35); else tek(nextT, 0.12);
        const note = MEL[bar][s];
        if (note && note !== '_') {
          let len = 1; while (s+len < 8 && MEL[bar][s+len] === '_') len++;
          pluck(N[note], nextT, EIGHTH*len*1.6, musicBus, 0.42);
          if (Math.random() < 0.18 && s < 7) pluck(N[note], nextT + EIGHTH/2, EIGHTH, musicBus, 0.22); // tremolo ornament
        }
        nextT += EIGHTH; step++;
      }
    }
    function startMusic(){
      if (!init() || on) return;
      ac.resume?.();
      NB = NB || noiseBuf(1);
      on = true; step = 0; nextT = ac.currentTime + 0.1;
      startDrone();
      timer = setInterval(tick, 50); tick();
      ui();
    }
    // --- sound effects ---
    function rub(){
      if (!init()) return; ac.resume?.(); NB = NB || noiseBuf(1);
      const t = ac.currentTime;
      ['D5','Eb5','Fs5','G5','A5','G5','Fs5','A5'].forEach((n,i) => pluck(N[n], t + i*0.09, 0.5, sfxBus, 0.25));
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = NB; s.loop = true; f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(300, t+0.6); f.frequency.exponentialRampToValueAtTime(4000, t+1.8);
      g.gain.setValueAtTime(0.0001, t+0.5); g.gain.exponentialRampToValueAtTime(0.5, t+1.0); g.gain.exponentialRampToValueAtTime(0.0001, t+2.0);
      s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t+0.5); s.stop(t+2.1);
    }
    function blip(){ if (!ac || !on) return; pluck(N.A5, ac.currentTime, 0.25, sfxBus, 0.18); pluck(N.D5, ac.currentTime+0.07, 0.3, sfxBus, 0.15); }
    function gong(){
      if (!ac) return; const t = ac.currentTime;
      [98, 147.5, 213, 289, 401].forEach((fr, i) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35/(i+1), t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+3.5 - i*0.4);
        o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+3.6);
      });
      ['D4','Fs4','A4','D5'].forEach((n,i) => pluck(N[n], t + 0.15 + i*0.08, 0.9, sfxBus, 0.28));
    }
    function setMuted(m){
      muted = m;
      try { localStorage.setItem('lampMuted', m ? '1' : '0'); } catch(e) {}
      if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.05);
      ui();
    }
    function ui(){
      const b = $('soundBtn'), playing = on && !muted;
      b.classList.toggle('playing', playing);
      b.setAttribute('aria-pressed', String(playing));
      $('soundLbl').textContent = playing ? 'Music on' : 'Sound off';
    }
    $('soundBtn').addEventListener('click', () => {
      if (!on) { setMuted(false); startMusic(); }
      else setMuted(!muted);
    });
    document.addEventListener('visibilitychange', () => { if (!ac) return; document.hidden ? ac.suspend?.() : (on && ac.resume?.()); });
    ui();
    return { startMusic, rub, blip, gong, get muted(){ return muted; } };
  })();
  document.addEventListener('submit', () => Audio.blip(), true);

  // ---------- step 1: rub ----------
  $('lamp').addEventListener('click', () => {
    if (st.step !== 'idle') return;
    st.step = 'name';
    Audio.rub();
    if (!Audio.muted) setTimeout(Audio.startMusic, 900);
    $('lamp').classList.add('rubbing');
    $('hint').textContent = 'Something stirs...';
    setTimeout(renderName, still ? 0 : 1300);
  });

  function renderName(){
    $('hint').textContent = 'The djinn is out';
    flow.innerHTML = `
      ${say(['<strong>Ahh, ten thousand years in a lamp and THIS is who rubs it.</strong>', 'Kidding. Mostly. Tell me your name, mortal, so I know whose wishes to process.'])}
      <form class="card" id="nameForm" style="margin-top:18px">
        <label for="nameIn">Your name</label>
        <input type="text" id="nameIn" maxlength="40" autocomplete="nickname" placeholder="e.g. Sam the Magnificent" required>
        <div class="row"><button class="btn" type="submit">Present myself</button></div>
      </form>`;
    $('nameIn').focus();
    $('nameForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('nameIn').value.trim();
      if(!v) return;
      st.name = v; st.wishes = []; renderWish();
    });
  }

  // ---------- step 2: wishes ----------
  const hints = ['I wish for a house by the sea...', 'I wish my boss would...', 'I wish I could...'];
  function renderWish(){
    const prev = st.wishes.slice();
    flow.innerHTML = `
      ${pips(prev.filter(Boolean).length)}
      <div style="margin-top:16px">${say([`Very well, <strong>${esc(st.name)}</strong>.`, 'Three wishes, all at once. Make them count. No wishing for more wishes. I have a legal team.'])}</div>
      <form class="card" id="wishForm" style="margin-top:18px" novalidate>
        ${[0,1,2].map(i => `
          <div style="display:flex;flex-direction:column;gap:6px">
            <label for="wish${i}">Wish ${i+1}</label>
            <textarea id="wish${i}" class="wishIn" maxlength="280" placeholder="${hints[i]}">${esc(prev[i] || '')}</textarea>
          </div>`).join('')}
        <p class="err" id="wishErr" hidden></p>
        <div class="row"><button class="btn" type="submit">Seal my fate</button></div>
      </form>`;
    const boxes = [0,1,2].map(i => $('wish' + i));
    const updatePips = () => {
      const n = boxes.filter(b => b.value.trim()).length;
      flow.querySelectorAll('.pip').forEach((p, i) => p.classList.toggle('on', i < n));
    };
    boxes.forEach(b => b.addEventListener('input', updatePips));
    boxes[0].focus();
    $('wishForm').addEventListener('submit', e => {
      e.preventDefault();
      const er = $('wishErr');
      const vals = boxes.map(b => b.value.trim());
      const empty = vals.findIndex(v => !v);
      if (empty !== -1) { er.hidden = false; er.textContent = `Wish ${empty+1} is empty. The djinn does not process blank paperwork.`; boxes[empty].focus(); return; }
      const greedy = vals.findIndex(v => /more wishes|infinite wishes|unlimited wishes/i.test(v));
      if (greedy !== -1) { er.hidden = false; er.textContent = `Wish ${greedy+1}: nice try. Wishing for more wishes is against Lamp Regulation 1.`; boxes[greedy].focus(); return; }
      st.wishes = vals;
      consult();
    });
  }

  // ---------- step 3: consult ----------
  async function consult(){
    flow.innerHTML = `${pips(3)}
      <div class="conjure" role="status" aria-live="polite">
        <div class="orb" aria-hidden="true"><i></i><i></i><i></i><b></b><s style="--a:30deg"></s><s style="--a:160deg"></s><s style="--a:270deg"></s></div>
        <p class="status" id="conjureMsg">Unrolling your wishes</p>
        <span class="elapsed">Working on your wishes<span class="dots"></span></span>
      </div>`;
    const lines = [
      'Unrolling your wishes',
      'Consulting an alarmingly thick rulebook',
      'Bribing the Council of Djinn',
      'Checking the stars for loopholes',
      'Calculating your odds (it\u2019s not looking great)',
      'Polishing the fine print'
    ];
    let li = 0;
    const msgEl = $('conjureMsg');
    const ticker = setInterval(() => {
      if (li >= lines.length - 1) return;
      li++;
      msgEl.classList.add('fade');
      setTimeout(() => { msgEl.textContent = lines[li]; msgEl.classList.remove('fade'); Audio.blip(); }, 350);
    }, 2200);
    let result = null, saved = false, limited = false;
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
      const res = await fetch(GENIE_API, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name: st.name, wishes: st.wishes }), signal: ctl.signal });
      clearTimeout(to);
      if (res.ok) { result = await res.json(); saved = !!result.saved; limited = !!result.limited; }
    } catch(e) { result = null; }
    clearInterval(ticker);
    if (!validResult(result)) { result = templateVerdict(); saved = false; }
    renderVerdict(result);
    Audio.gong();
    note(saved ? (limited ? 'Sealed in the ledger. (The djinn is out of brainpower for today, so you got the house-standard prophecy.)' : 'Your wishes are sealed in the lamp\u2019s ledger.') : 'The ledger was out of reach, so your wishes were not recorded. Your fortune still stands.');
  }

  function validResult(r){
    return r && Array.isArray(r.wishes) && r.wishes.length === 3 && r.wishes.every(w => w && w.eta && typeof w.probability === 'number' && w.verdict);
  }

  // ---------- fallback templates (used only if the server is unreachable) ----------
  const shuffle = a => { const c=a.slice(); for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; } return c; };
  function templateVerdict(){
    const etas = [
      () => { const d=new Date(); d.setDate(d.getDate()+Math.floor(Math.random()*4000)+30); return d.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'}) + ', around 3:17 a.m.'; },
      () => 'The Tuesday after pigs achieve flight',
      () => 'Right after you finally reply to that group chat',
      () => 'Two business days after the heat death of the universe',
      () => 'The moment you stop checking for it',
      () => 'Next leap year, if Mercury behaves',
      () => 'Shortly after you clean your room'
    ];
    const verdicts = [
      'Bold. Ambitious. Deeply unrealistic. I respect the confidence.',
      'I ran this past the Council of Djinn. They laughed for eleven minutes.',
      'This is achievable, which is honestly a bit boring of you.',
      'I could grant this, but then what would you complain about?',
      'Approved in principle. Rejected in practice. Welcome to bureaucracy.',
      'Strong wish. Weak follow-through, if your history is anything to go by.'
    ];
    const fine = [
      'Void if wished for on an empty stomach.',
      'Djinn not liable for side effects, including smugness.',
      'Delivery may arrive in the form of a coupon.',
      'Batteries not included. Neither is effort.',
      'Offer valid only in your dreams and select regions.'
    ];
    return {
      opening: `Behold, ${st.name}! Your destiny, freshly smoked:`,
      wishes: (() => { const e=shuffle(etas), v=shuffle(verdicts), f=shuffle(fine), pr=shuffle([3,9,17,28,41,55,68,77,86,94]); return [0,1,2].map(i => ({ eta: e[i](), probability: pr[i], verdict: v[i], finePrint: f[i] })); })(),
      farewell: 'Now begone. I have a lamp to dust.',
      source: 'template'
    };
  }

  function oddsLabel(p){ return p>=80?'Basically done':p>=50?'Coin-flip energy':p>=20?'Pray harder':p>=5?'Lottery-adjacent':'Not in this universe'; }

  function renderVerdict(r){
    flow.innerHTML = `
      ${say([`<strong>${esc(r.opening || 'Behold your destiny.')}</strong>`])}
      <div class="verdicts" style="margin-top:18px">
        ${r.wishes.map((w,i)=>`
          <article class="scroll">
            <span class="num">Wish ${i+1}</span>
            <p class="wish">“${esc(st.wishes[i])}”</p>
            <div class="stats">
              <div class="stat"><div class="k">Arrives</div><div class="v">${esc(w.eta)}</div></div>
              <div class="stat"><div class="k">Odds · ${esc(oddsLabel(w.probability))}</div><div class="v">${w.probability}%</div><div class="meter"><i style="width:${Math.max(2,w.probability)}%"></i></div></div>
            </div>
            <p class="roast">${esc(w.verdict)}</p>
            ${w.finePrint ? `<p class="fine">Fine print: ${esc(w.finePrint)}</p>` : ''}
          </article>`).join('')}
      </div>
      <div style="margin-top:18px">${say([esc(r.farewell || 'Begone.'), '<span id="saveNote" style="color:var(--muted);font-size:14px">The djinn is filing your paperwork...</span>'])}</div>
      <div class="row" style="margin-top:18px; justify-content:center">
        <button class="btn" id="copyBtn" type="button">Copy my fortune</button>
        <button class="btn ghost" id="againBtn" type="button">Rub again</button>
      </div>`;
    $('againBtn').addEventListener('click', () => { st.step='name'; st.wishes=[]; renderWish(); scrollTo({top:0, behavior: still?'auto':'smooth'}); });
    $('copyBtn').addEventListener('click', () => {
      const txt = `The Brass Lamp has spoken for ${st.name}:\n` + r.wishes.map((w,i)=>`${i+1}. "${st.wishes[i]}" - ${w.probability}% odds, arriving ${w.eta}. ${w.verdict}`).join('\n');
      const done = () => $('copyBtn').textContent = 'Copied';
      navigator.clipboard?.writeText(txt).then(done).catch(() => { $('copyBtn').textContent = 'Copy blocked here'; });
    });
  }

  // ---------- saving ----------
  function note(t){ const n=$('saveNote'); if(n) n.textContent = t; }
})();
</script>

</body>
</html>
